name: Forge exact-SHA candidate qualification

# Trust boundary
# --------------
# This workflow's definition is loaded from the trusted default branch
# (`master`) because the pull_request trigger is `pull_request_target`.  The
# candidate therefore cannot define, weaken, skip or re-point its own
# qualification: editing this file in a candidate branch changes a data blob
# that the qualification only compares, never an executing definition.
#
# Every identity is exact and separately recorded:
#   * workflow authority : the `master` commit that supplies this definition
#   * candidate          : the exact 40-hex commit under qualification
#   * comparison base    : inspected merge-base Git data only
#
# PR mergeability, GitHub's synthetic merge result and `mergeable` /
# `mergeStateStatus` are never read.  A green run of this workflow is a CI
# qualification result and is not a Magic Rules qualification.
#
# Only PASS exits 0.  FAIL / PARTIAL / NOT_RUN / UNKNOWN each have a distinct
# nonzero exit code, so no consumer can read an unproven qualification as green.

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-hex candidate commit to qualify (required).'
        required: true
        type: string
      fetch_ref:
        description: 'Optional exact ref to fetch the candidate from, e.g. refs/pull/17/head. Omit for an explicit SHA.'
        required: false
        type: string

# Least privilege: no job receives a token capability it does not need.  The
# candidate is never checked out with credentials.
permissions: {}

env:
  PYTHONHASHSEED: "0"
  # Bounded qualification surface.  A module that reports no evidence makes the
  # qualification PARTIAL rather than silently narrower.
  QUALIFY_EXPECTED_MODULES: "forge-game forge-gui-desktop"
  # Test classes the trusted contract declares outside the qualified surface.
  # Only skips in these classes are excluded from the completeness requirement;
  # a skip anywhere else, or a skip that cannot be attributed to a class, makes
  # the qualification PARTIAL.  The observed and undeclared skip sets are always
  # reported in the evidence, so this list is an auditable scope statement and
  # never a silent suppression.
  #
  # forge.net.NetworkPlayIntegrationTest stress cases are opt-in by design: they
  # self-report "Stress tests skipped. Use -Drun.stress.tests=true to run." and
  # exercise network play, not the bounded qualification surface. Measured on
  # Forge master b95c07b3436bf582274ea458520ca30aa379d6e7: 6 such skips.
  # Adding a class here is a change to the trusted definition on master and is
  # therefore visible in review.  No Rules or card-behavior test class is
  # excluded here.
  QUALIFY_OUT_OF_BAND_CLASSES: "forge.net.NetworkPlayIntegrationTest"
  QUALIFY_JAVA: "21"

jobs:
  # ------------------------------------------------------------------------ #
  # Job 1 - trusted resolution of the exact candidate identity.
  # ------------------------------------------------------------------------ #
  candidate-identity:
    name: Exact candidate identity (trusted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      candidate_tree: ${{ steps.identity.outputs.candidate_tree }}
      candidate_ref: ${{ steps.identity.outputs.candidate_ref }}
    steps:
      # The trusted validator source is the default branch itself, so
      # HEAD is a branch tip and the executed definition is byte-identical to
      # the definition on `master`.
      - name: Checkout trusted qualification authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse an untrusted dispatch ref
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' }}
        run: |
          echo "::error::workflow_dispatch must run the master definition (got ${{ github.ref }})"
          exit 1

      - name: Select the exact candidate input
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
          INPUT_FETCH_REF: ${{ inputs.fetch_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            sha="$PR_HEAD_SHA"
            ref="refs/pull/$PR_NUMBER/head"
          else
            sha="$INPUT_SHA"
            ref="$INPUT_FETCH_REF"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate sha is not a full 40-hex object name: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve and prove the source lock
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.select.outputs.sha }}
          CANDIDATE_REF: ${{ steps.select.outputs.ref }}
          EVENT_BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No --run-sha is declared on purpose.  The executing authority is the
          # trusted checkout's own HEAD, which source_lock.py proves is the
          # master tip.  github.sha is only the event's base commit, which may
          # legitimately lag behind master by benign default-branch advancement;
          # it is passed as --event-base-sha and proved equal-or-ancestor instead.
          args=(
            --repo .
            --candidate-sha "$CANDIDATE_SHA"
            --event-base-sha "$EVENT_BASE_SHA"
            --output "$RUNNER_TEMP/qualification/source-lock.json"
          )
          if [[ -n "$CANDIDATE_REF" ]]; then
            args+=(--fetch-ref "$CANDIDATE_REF")
          fi
          python3 .github/qualification/source_lock.py "${args[@]}"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          lock = json.load(open(os.environ["RUNNER_TEMP"] + "/qualification/source-lock.json"))
          print("candidate_sha=" + lock["candidate"]["sha"])
          print("candidate_tree=" + lock["candidate"]["tree"])
          print("candidate_ref=" + lock["candidate"]["fetched_from"])
          PY

      - name: Upload trusted source lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d17-source-lock
          path: ${{ runner.temp }}/qualification/source-lock.json
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------ #
  # Job 2 - bounded qualification of the exact candidate commit.
  #
  # The candidate tree is materialized in a separate runner directory and never
  # overwrites the trusted workspace.  This job executes candidate *code* (that
  # is the point of qualification), but its steps and their exit codes come from
  # the trusted definition.
  # ------------------------------------------------------------------------ #
  candidate-qualification:
    name: Exact candidate qualification (bounded surface)
    needs: candidate-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout trusted authority for job control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize the exact candidate commit
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.candidate-identity.outputs.candidate_sha }}
          CANDIDATE_REF: ${{ needs.candidate-identity.outputs.candidate_ref }}
          TRUSTED_CANDIDATE_TREE: ${{ needs.candidate-identity.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/candidate"

          # Fetch the exact object into the trusted checkout first.  Any failure
          # here is fatal: there is no fallback to a branch tip, to another SHA,
          # or to a synthetic merge.  The locked `fetched_from` is a real ref only
          # when it starts with `refs/`; otherwise the candidate came from an
          # explicit SHA.
          if [[ "$CANDIDATE_REF" == refs/* ]]; then
            git fetch --quiet --no-tags origin "$CANDIDATE_REF"
          else
            git fetch --quiet --no-tags origin "$CANDIDATE_SHA"
          fi
          fetched="$(git rev-parse FETCH_HEAD)"
          if [[ "$fetched" != "$CANDIDATE_SHA" ]]; then
            echo "::error::fetched $fetched but the locked candidate is $CANDIDATE_SHA"
            exit 1
          fi

          # The candidate working tree is a separate repository: its own HEAD,
          # index, config and refs, borrowing the object database read-only via
          # alternates so that a 1 GiB pack is not duplicated.  It shares no ref
          # with the trusted checkout and never replaces the trusted workspace.
          git clone --quiet --no-checkout --shared "$GITHUB_WORKSPACE" "$candidate_dir"
          git -C "$candidate_dir" checkout --quiet --detach "$CANDIDATE_SHA"

          # Re-prove the exact identity from inside the candidate workspace.
          observed="$(git -C "$candidate_dir" rev-parse HEAD)"
          tree="$(git -C "$candidate_dir" rev-parse HEAD^{tree})"
          if [[ "$observed" != "$CANDIDATE_SHA" ]]; then
            echo "::error::candidate checkout is $observed, expected $CANDIDATE_SHA"
            exit 1
          fi
          if [[ "$tree" != "$TRUSTED_CANDIDATE_TREE" ]]; then
            echo "::error::candidate TREE $tree does not match locked TREE $TRUSTED_CANDIDATE_TREE"
            exit 1
          fi
          echo "sha=$observed" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Setup java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.QUALIFY_JAVA }}
          cache: maven

      - name: Run bounded candidate test surface
        id: tests
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -o pipefail
          cd "$CANDIDATE_DIR"
          xvfb-run -a mvn -B \
            --settings ./.mvn/local-settings.xml \
            -pl forge-gui-desktop -am test

      - name: Record the trusted run report
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.candidate-identity.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.candidate-identity.outputs.candidate_tree }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CANDIDATE_STEP_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          exit_code=0
          if [[ "$TESTS_OUTCOME" != "success" ]]; then exit_code=1; fi
          if [[ "$CANDIDATE_STEP_OUTCOME" != "success" ]]; then exit_code=1; fi
          TESTS_OUTCOME="$TESTS_OUTCOME" \
          RUN_EXIT_CODE="$exit_code" \
          python3 - <<'PY'
          import json, os
          payload = {
              "schema": "forge.candidate-qualification.run-report/1",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "candidate_tree": os.environ["CANDIDATE_TREE"],
              "maven_command": (
                  "xvfb-run -a mvn -B --settings ./.mvn/local-settings.xml "
                  "-pl forge-gui-desktop -am test"
              ),
              "completed": os.environ["RUN_EXIT_CODE"] == "0",
              "step_exit_codes": {
                  "materialize_candidate": 0 if os.environ["CANDIDATE_STEP_OUTCOME"] == "success" else 1,
                  "bounded_test_surface": 0 if os.environ["TESTS_OUTCOME"] == "success" else 1,
              },
          }
          path = os.environ["RUNNER_TEMP"] + "/run-report.json"
          with open(path, "w") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      # upload-artifact roots the archive at the least common ancestor of these
      # paths, i.e. $RUNNER_TEMP, so the archive contains exactly:
      #   run-report.json                                        (trusted)
      #   candidate/<module>/target/surefire-reports/TEST-*.xml  (candidate data)
      # Job 3 depends on that layout.
      - name: Upload candidate qualification inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d17-candidate-run
          path: |
            ${{ runner.temp }}/run-report.json
            ${{ runner.temp }}/candidate/forge-game/target/surefire-reports
            ${{ runner.temp }}/candidate/forge-gui-desktop/target/surefire-reports
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------------ #
  # Job 3 - trusted verdict derivation.
  # ------------------------------------------------------------------------ #
  qualification-evidence:
    name: Exact candidate qualification verdict (trusted)
    needs: [candidate-identity, candidate-qualification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted qualification authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Download trusted source lock
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005964372cb63d33 # v4.1.8
        with:
          name: d17-source-lock
          path: ${{ runner.temp }}/qualification

      - name: Download candidate run evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005964372cb63d33 # v4.1.8
        with:
          name: d17-candidate-run
          path: ${{ runner.temp }}/candidate-evidence

      - name: Derive the exact-SHA qualification verdict
        id: verdict
        shell: bash
        env:
          EXPECTED_MODULES: ${{ env.QUALIFY_EXPECTED_MODULES }}
          OUT_OF_BAND_CLASSES: ${{ env.QUALIFY_OUT_OF_BAND_CLASSES }}
        run: |
          set -uo pipefail
          modules=()
          for module in $EXPECTED_MODULES; do modules+=(--expect-report-module "$module"); done
          out_of_band=()
          for class in $OUT_OF_BAND_CLASSES; do out_of_band+=(--out-of-band-test-class "$class"); done
          python3 .github/qualification/qualify.py \
            --lock "$RUNNER_TEMP/qualification/source-lock.json" \
            --run-report "$RUNNER_TEMP/candidate-evidence/run-report.json" \
            --reports-root "$RUNNER_TEMP/candidate-evidence/candidate" \
            "${modules[@]}" \
            "${out_of_band[@]}" \
            --output "$RUNNER_TEMP/evidence/FORGE_CANDIDATE_QUALIFICATION.json"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # The verdict is surfaced, not hidden: the next step is unconditional
          # and exits with this code, so only PASS leaves the job green.  This
          # step exits 0 purely so the evidence upload below still runs.
          exit 0

      - name: Upload exact candidate qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-candidate-qualification-${{ needs.candidate-identity.outputs.candidate_sha }}
          path: ${{ runner.temp }}/evidence/FORGE_CANDIDATE_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 90

      # Surface the verdict as a step summary so the four evidence classes are
      # readable without downloading artifacts.  The exit code is the verdict:
      # only PASS is 0.
      - name: Surface classification
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.verdict.outputs.exit_code }}
        run: |
          set -uo pipefail
          echo "### Forge exact-SHA candidate qualification" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = os.environ["RUNNER_TEMP"] + "/evidence/FORGE_CANDIDATE_QUALIFICATION.json"
          try:
              data = json.load(open(path))
          except Exception as exc:  # evidence must be readable to be reported
              print("- evidence unavailable: {}".format(exc))
          else:
              print("- exact candidate qualification: **{}**".format(data.get("verdict")))
              print("- reason: {}".format(data.get("reason")))
              lock = data.get("source_lock", {})
              print("- workflow authority: `{}`".format(lock.get("workflow_authority_sha")))
              print("- candidate SHA: `{}`".format(
                  (data.get("candidate") or {}).get("sha")))
              print("- candidate TREE: `{}`".format(
                  (data.get("candidate") or {}).get("tree")))
              for key in ("pr_mergeability", "synthetic_merge_evidence",
                          "rules_qualification_evidence"):
                  block = data.get(key, {})
                  print("- {}: {} (credit: {})".format(
                      key, block.get("status"), block.get("credit")))
          PY
          if [[ -z "$EXIT_CODE" ]]; then
            echo "::error::qualification produced no exit code; treating as UNKNOWN"
            exit 4
          fi
          exit "$EXIT_CODE"