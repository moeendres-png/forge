name: WS40 Forge Core Remediation

on:
  push:
    branches:
      - foundry/ws40-af04-core-remediation
    paths:
      - '.github/ws40/**'
      - '.github/workflows/ws40-core-remediation.yml'
      - 'forge-game/src/main/java/forge/game/combat/CombatDamageDecision.java'
      - 'forge-gui-desktop/src/test/java/forge/game/combat/WS40CombatDamageCoreTest.java'
      - 'forge-gui-desktop/src/test/java/forge/gamesimulationtests/util/PlayerControllerForTests.java'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundry/ws40-af04-core-remediation
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify exact WS40 parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ef4c834dbbca21a099ae751fb52b2326abdf1e02 HEAD
          test "$(git rev-parse ef4c834dbbca21a099ae751fb52b2326abdf1e02^{tree})" = "abd80b8e9ba1178bcd8e8fb3147ed6df292b4597"
      - name: Apply bounded WS40 patch if not materialized
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "CombatDamageAssignmentValidator.validateAll" forge-game/src/main/java/forge/game/combat/Combat.java; then
            echo "WS40 core patch already materialized"
          else
            python3 .github/ws40/apply_ws40_core_patch.py
          fi
      - name: Normalize generated patch
        run: python3 .github/ws40/normalize_ws40_generated_patch.py
      - name: Raw combat-map bypass audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "getController().assignCombatDamage" forge-game/src/main/java forge-ai/src/main/java forge-gui/src/main/java; then exit 1; fi
          if grep -R "assignCombatDamage(Card attacker, CardCollectionView blockers" forge-game/src/main/java forge-ai/src/main/java forge-gui/src/main/java forge-gui-desktop/src/test/java; then exit 1; fi
          if grep -R "static .*distributeAIDamage" forge-ai/src/main/java; then exit 1; fi
      - name: Compile affected engine modules
        run: mvn -B -pl forge-game,forge-ai,forge-gui,forge-gui-desktop -am -DskipTests compile
      - name: Run forge-game tests
        run: mvn -B -pl forge-game -am test
      - name: Run WS40 native combat qualification matrix
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a mvn -B -pl forge-gui-desktop -am -Dtest=forge.game.combat.WS40CombatDamageCoreTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Commit normalized generated source if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated source delta"
            exit 0
          fi
          git config user.name "ws40-foundry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forge-game forge-ai forge-gui \
            forge-gui-desktop/src/test/java/forge/game/combat/WS40CombatDamageCoreTest.java \
            forge-gui-desktop/src/test/java/forge/gamesimulationtests/util/PlayerControllerForTests.java
          if git diff --cached --quiet; then
            echo "No generated engine/test source delta"
            exit 0
          fi
          git commit -m "WS40 normalize combat damage core migration"
          git push origin HEAD:foundry/ws40-af04-core-remediation
