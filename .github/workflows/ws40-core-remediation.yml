name: WS40 Forge Core Remediation

on:
  push:
    branches:
      - foundry/ws40-af04-core-remediation
    paths:
      - '.github/ws40/**'
      - '.github/workflows/ws40-core-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundry/ws40-af04-core-remediation
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify exact WS40 parent
        shell: bash
        run: |
          git merge-base --is-ancestor ef4c834dbbca21a099ae751fb52b2326abdf1e02 HEAD
          test "$(git rev-parse ef4c834dbbca21a099ae751fb52b2326abdf1e02^{tree})" = "abd80b8e9ba1178bcd8e8fb3147ed6df292b4597"
      - name: Apply bounded WS40 patch
        run: python3 .github/ws40/apply_ws40_core_patch.py
      - name: Compile affected engine modules
        run: mvn -B -pl forge-game,forge-ai,forge-gui -am -DskipTests compile
      - name: Run forge-game tests
        run: mvn -B -pl forge-game -am test
      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated patch delta"
            exit 0
          fi
          git config user.name "ws40-foundry-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forge-game forge-ai forge-gui
          git commit -m "WS40 migrate combat damage legality into Forge Core"
          git push origin HEAD:foundry/ws40-af04-core-remediation
