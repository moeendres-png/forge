name: WS40 Forge Patch Reproducibility

on:
  push:
    branches:
      - foundry/ws40-af04-core-remediation
    paths:
      - '.github/workflows/ws40-patch-repro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WS40_BASELINE_COMMIT: ef4c834dbbca21a099ae751fb52b2326abdf1e02
      WS40_BASELINE_TREE: abd80b8e9ba1178bcd8e8fb3147ed6df292b4597
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundry/ws40-af04-core-remediation
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify final source lock and single patch authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$WS40_BASELINE_COMMIT" HEAD
          test "$(git rev-parse "$WS40_BASELINE_COMMIT^{tree}")" = "$WS40_BASELINE_TREE"
          test -f .github/ws40/apply_ws40_core_patch.py
          test -f .github/ws40/normalize_ws40_generated_patch.py
          test ! -e tools/ws40_apply_core_remediation.py
          if git grep -n 'tools/ws40_apply_core_remediation.py'; then
            echo 'obsolete duplicate patcher is still referenced' >&2
            exit 1
          fi

      - name: Reproduce materialized engine from exact baseline
        shell: bash
        run: |
          set -euo pipefail
          repro="$RUNNER_TEMP/ws40-repro"
          git worktree add --detach "$repro" "$WS40_BASELINE_COMMIT"
          mkdir -p "$repro/.github/ws40"
          cp .github/ws40/apply_ws40_core_patch.py "$repro/.github/ws40/apply_ws40_core_patch.py"
          cp .github/ws40/normalize_ws40_generated_patch.py "$repro/.github/ws40/normalize_ws40_generated_patch.py"

          python3 "$repro/.github/ws40/apply_ws40_core_patch.py"
          python3 "$repro/.github/ws40/normalize_ws40_generated_patch.py"

          cat > "$RUNNER_TEMP/ws40-expected-files.txt" <<'EOF'
          forge-ai/src/main/java/forge/ai/ComputerUtilCombat.java
          forge-ai/src/main/java/forge/ai/PlayerControllerAi.java
          forge-game/src/main/java/forge/game/ability/effects/DamageDealEffect.java
          forge-game/src/main/java/forge/game/combat/Combat.java
          forge-game/src/main/java/forge/game/combat/CombatDamageAssignmentValidator.java
          forge-game/src/main/java/forge/game/combat/CombatDamageDecision.java
          forge-game/src/main/java/forge/game/combat/CombatDamageDecisionView.java
          forge-game/src/main/java/forge/game/combat/CombatDamageSelection.java
          forge-game/src/main/java/forge/game/player/AmountDistributionDecision.java
          forge-game/src/main/java/forge/game/player/AmountDistributionDecisionView.java
          forge-game/src/main/java/forge/game/player/AmountDistributionSelection.java
          forge-game/src/main/java/forge/game/player/PlayerController.java
          forge-gui-desktop/src/test/java/forge/game/combat/WS40CombatDamageCoreTest.java
          forge-gui-desktop/src/test/java/forge/gamesimulationtests/util/PlayerControllerForTests.java
          forge-gui/src/main/java/forge/player/PlayerControllerHuman.java
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/ws40-expected-files.txt"
          sort -o "$RUNNER_TEMP/ws40-expected-files.txt" "$RUNNER_TEMP/ws40-expected-files.txt"

          git -C "$repro" status --porcelain --untracked-files=all -- \
            forge-ai/src/main/java \
            forge-game/src/main/java \
            forge-gui/src/main/java \
            forge-gui-desktop/src/test/java/forge/game/combat/WS40CombatDamageCoreTest.java \
            forge-gui-desktop/src/test/java/forge/gamesimulationtests/util/PlayerControllerForTests.java \
            | cut -c4- | sort > "$RUNNER_TEMP/ws40-actual-files.txt"
          diff -u "$RUNNER_TEMP/ws40-expected-files.txt" "$RUNNER_TEMP/ws40-actual-files.txt"

          while IFS= read -r path; do
            test -e "$repro/$path"
            test -e "$GITHUB_WORKSPACE/$path"
            if ! cmp -s "$repro/$path" "$GITHUB_WORKSPACE/$path"; then
              echo "reproduced file differs from frozen branch: $path" >&2
              diff -u "$GITHUB_WORKSPACE/$path" "$repro/$path" || true
              exit 1
            fi
          done < "$RUNNER_TEMP/ws40-expected-files.txt"

          before="$({ while IFS= read -r path; do sha256sum "$repro/$path"; done < "$RUNNER_TEMP/ws40-expected-files.txt"; } | sha256sum | awk '{print $1}')"
          python3 "$repro/.github/ws40/apply_ws40_core_patch.py"
          python3 "$repro/.github/ws40/normalize_ws40_generated_patch.py"
          after="$({ while IFS= read -r path; do sha256sum "$repro/$path"; done < "$RUNNER_TEMP/ws40-expected-files.txt"; } | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
          printf '%s\n' "$before" > "$RUNNER_TEMP/ws40-source-digest.txt"
          printf '%s\n' "$repro" > "$RUNNER_TEMP/ws40-repro-path.txt"

      - name: Raw bypass audit on reproduced tree
        shell: bash
        run: |
          set -euo pipefail
          repro="$(cat "$RUNNER_TEMP/ws40-repro-path.txt")"
          cd "$repro"
          if grep -R "getController().assignCombatDamage" forge-game/src/main/java forge-ai/src/main/java forge-gui/src/main/java; then exit 1; fi
          if grep -R "assignCombatDamage(Card attacker, CardCollectionView blockers" forge-game/src/main/java forge-ai/src/main/java forge-gui/src/main/java forge-gui-desktop/src/test/java; then exit 1; fi
          if grep -R "static .*distributeAIDamage" forge-ai/src/main/java; then exit 1; fi

      - name: Compile reproduced affected modules
        shell: bash
        run: |
          set -euo pipefail
          repro="$(cat "$RUNNER_TEMP/ws40-repro-path.txt")"
          cd "$repro"
          mvn -B -ntp -pl forge-game,forge-ai,forge-gui,forge-gui-desktop -am -DskipTests compile

      - name: Run reproduced forge-game tests
        shell: bash
        run: |
          set -euo pipefail
          repro="$(cat "$RUNNER_TEMP/ws40-repro-path.txt")"
          cd "$repro"
          mvn -B -ntp -pl forge-game -am test

      - name: Run reproduced WS40 native combat matrix
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          repro="$(cat "$RUNNER_TEMP/ws40-repro-path.txt")"
          cd "$repro"
          xvfb-run -a mvn -B -ntp -pl forge-gui-desktop -am \
            -Dtest=forge.game.combat.WS40CombatDamageCoreTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Freeze reproducibility evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ws40-patch-repro
          cp "$RUNNER_TEMP/ws40-expected-files.txt" artifacts/ws40-patch-repro/EXPECTED_FILES.txt || true
          cp "$RUNNER_TEMP/ws40-actual-files.txt" artifacts/ws40-patch-repro/ACTUAL_FILES.txt || true
          cp "$RUNNER_TEMP/ws40-source-digest.txt" artifacts/ws40-patch-repro/SOURCE_DIGEST.txt || true
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path('artifacts/ws40-patch-repro')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          p = {
              'schema_version': 'ws40-forge-patch-repro/1.0.0',
              'baseline_commit': os.environ['WS40_BASELINE_COMMIT'],
              'baseline_tree': os.environ['WS40_BASELINE_TREE'],
              'final_commit': git('rev-parse', 'HEAD'),
              'final_tree': git('rev-parse', 'HEAD^{tree}'),
              'canonical_patcher': '.github/ws40/apply_ws40_core_patch.py',
              'normalizer': '.github/ws40/normalize_ws40_generated_patch.py',
              'obsolete_duplicate_absent': not pathlib.Path('tools/ws40_apply_core_remediation.py').exists(),
              'expected_file_count': len((out / 'EXPECTED_FILES.txt').read_text().splitlines()) if (out / 'EXPECTED_FILES.txt').exists() else None,
              'reproduced_source_digest': (out / 'SOURCE_DIGEST.txt').read_text().strip() if (out / 'SOURCE_DIGEST.txt').exists() else None,
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'workflow_job': os.environ.get('GITHUB_JOB'),
          }
          (out / 'WS40_PATCH_REPRO.json').write_text(json.dumps(p, indent=2, sort_keys=True) + '\n')
          PY
          find artifacts/ws40-patch-repro -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/ws40-patch-repro/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws40-forge-patch-repro-${{ github.sha }}
          path: artifacts/ws40-patch-repro/
          if-no-files-found: error
          retention-days: 90
