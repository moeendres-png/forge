name: Test build

on: [push, pull_request]

# D18 (#499): a newer head of the same pull request supersedes this run, so
# the older run is cancelled. Every other event (a push to master or to a
# qualification branch, a tag, workflow_dispatch, schedule) gets a group of
# its own and is never cancelled. Contract: .github/ci/test_concurrency_contract.py
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# least privilege: these jobs only read the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    name: Test with Java ${{ matrix.Java }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      - name: Setup java
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: D20 provenance controls
        run: python3 -I .github/ci/test_provenance.py selftest -v

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Run tests in virtual framebuffer
        shell: bash
        run: |
          set -uo pipefail
          printf '255\n' > "$RUNNER_TEMP/d20-maven-exit.txt"
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          set +e
          mvn -U -B clean test
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/d20-maven-exit.txt"
          exit "$rc"

      - name: Collect D20 source-bound test provenance
        if: always()
        shell: bash
        env:
          D20_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I .github/ci/test_provenance.py collect \
            --repo . \
            --known-not-run .github/ci/known-not-run.json \
            --maven-exit-file "$RUNNER_TEMP/d20-maven-exit.txt" \
            --java-version "${{ matrix.java }}" \
            --expected-source-sha "$GITHUB_SHA" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-sha "$GITHUB_SHA" \
            --pr-head-sha "$D20_PR_HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/d20-evidence/FORGE_TEST_PROVENANCE.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload D20 provenance and raw test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-test-provenance-java-${{ matrix.java }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/d20-evidence/FORGE_TEST_PROVENANCE.json
            **/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30
