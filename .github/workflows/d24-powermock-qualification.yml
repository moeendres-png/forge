name: D24 PowerMock execution qualification

on:
  push:
    branches:
      - hardening/forge-d24-powermock-restoration-20261004

permissions:
  contents: read

jobs:
  execute-restored-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    name: D24 restored tests Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Setup java
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install virtual framebuffer
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Execute real Forge tests
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean test
